[package]
name = "mrkdwn"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Render Markdown nicely in the terminal"
license = "GPL-3.0-or-later"
authors = ["alpwrk"]
repository = "https://github.com/alpwrk/mrkdwn"
readme = "README.md"
keywords = ["markdown", "terminal", "cli", "viewer", "renderer"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
termimad = "0.35.5"
